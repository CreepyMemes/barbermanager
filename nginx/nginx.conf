server {
    listen 80;
    server_name manageBarber.s1lentCommit.duckdns.org;

    location / {
        proxy_pass http://manageBarber-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://manageBarber-backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
